services:
  postgres:
    image: postgres:latest
    env_file:
      - backend/.env
    volumes:
      - ./postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432
    networks:
      - app

networks:
  app:

volumes:
  postgres_data:
    driver: local
