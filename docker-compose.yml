services:
  api:
    container_name: cr_api
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    ports:
      - 8000:8000
    depends_on:
      - postgres
    networks:
      - app
  postgres:
    container_name: cr_db
    image: postgres:latest
    env_file:
      - backend/.env
    volumes:
      - ./postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432
    networks:
      - app

networks:
  app:

volumes:
  postgres_data:
    driver: local
